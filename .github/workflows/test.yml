name: test

on:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# One job per check, so each PR check line names what failed (`test / unit`, `test / build`, …) and the checks run in parallel.
jobs:
  # `unit` and `build` use xcode-27, the only GitHub-hosted label with the macOS 27 the package and the app require.
  unit:
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - run: swift test --package-path Packages/Priority

  build:
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # This build is never uploaded, so it needs no real version.
      - run: scripts/build-app.sh 0.0.0 "$RUNNER_TEMP/build-output"

  commitlint:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # commitlint walks the PR's commit range

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Runs the pinned semantic-release in dry-run mode, so a version or config that cannot load fails its pull request instead of the next release on main.
  semantic-release-dry-run:
    # A fork's token is read-only, and the dry run needs write access.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the dry run still checks it may push (`git push --dry-run`); it pushes nothing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # semantic-release reads every tag and commit since the last release

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # On a pull_request run, semantic-release reads the branch from GitHub's variables as `refs/pull/<n>/merge`, a branch no config lists, and exits before it checks anything. With GITHUB_ACTIONS unset it reads the branch from git instead: the PR head, checked out as a local branch of the same name, which `--branches` makes the release branch for this run.
      - run: |
          git checkout -B "$GITHUB_HEAD_REF"
          env -u GITHUB_ACTIONS bunx --package semantic-release@25.0.9 --package @semantic-release/exec@7.1.0 semantic-release --dry-run --branches "$GITHUB_HEAD_REF"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
