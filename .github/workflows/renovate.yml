name: renovate

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
  # A tick of the checkbox in a Renovate PR's description edits the PR. `pull_request_target`, not `pull_request`: GitHub starts no `pull_request` workflow for a PR in conflict, and that is the PR whose checkbox gets ticked. The job checks out `dev`, never the PR's code.
  pull_request_target:
    types: [edited]

jobs:
  renovate:
    # Renovate edits a PR's description itself, with the checkbox empty, so most `edited` events are not a tick. The head repo test keeps a PR from a fork, which anyone can name `renovate/…`, from starting a run.
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'renovate/') && contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->'))
    # On the job, not the workflow: a run this `if` skips must not replace a waiting run that a tick started.
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Renovate writes with the app token below, not with GITHUB_TOKEN: a PR opened with GITHUB_TOKEN starts no workflow, so its checks would never run.
    permissions:
      contents: read
    steps:
      - name: Create the app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate exits with an error on a Node version its `engines` field leaves out.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      # Renovate's bun manager runs the bun on PATH to update each bun.lock.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile --cwd .github

      - name: Run Renovate
        run: .github/node_modules/.bin/renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commits through the GitHub API, which signs them as the app, so a branch rule that requires signed commits accepts them.
          RENOVATE_PLATFORM_COMMIT: enabled
