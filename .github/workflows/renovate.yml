name: renovate

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    # Renovate writes with the app token below, not with GITHUB_TOKEN: a PR opened with GITHUB_TOKEN starts no workflow, so its checks would never run.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Create the app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.223.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commits through the GitHub API, which signs them as the app, so a branch rule that requires signed commits accepts them.
          RENOVATE_PLATFORM_COMMIT: enabled
          # The action mounts the runner's /tmp into Renovate's container, so the next step reads the report there.
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPORT_PATH: /tmp/renovate-report.json

      - name: Check that Renovate found every version pin
        id: check
        # An explicit `shell: bash` runs with pipefail, so a failing check fails the step through `tee`.
        shell: bash
        run: bun maintenance/updates/check-renovate.mjs /tmp/renovate-report.json 2>&1 | tee /tmp/check-renovate.txt

      - name: Report a missed version pin
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Renovate missed an expected version pin
        run: |
          issue=$(gh issue list --state open --label needs-human --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file /tmp/check-renovate.txt
          else
            gh issue create --title "$TITLE" --label needs-human --body-file /tmp/check-renovate.txt
          fi
